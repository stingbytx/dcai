<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dotcomAI — Free AI Service Platform with 50+ AI Models | Made in Sri Lanka</title>
<meta name="description" content="dotcomAI is a Sri Lankan AI platform providing accessible AI-powered services with 50+ AI Models through modern LLM technology. Built by Manuja Damsara under DotcomOne">
<meta name="keywords" content="dotcomAI, dotcom AI, AI Sri Lanka, artificial intelligence Sri Lanka, free AI, free AI tools, AI assistant, AI platform, LLM platform, AI chatbot, Sri Lankan AI platform, AI tools Sri Lanka, AI software Sri Lanka, Manuja Damsara, DotcomOne, UniPOS">
<link rel="icon" type="image/png" href="favicon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============ MY AI — ChatGPT-style theme ============ */
:root{--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;--serif:Georgia,"Times New Roman","Iowan Old Style",serif;--mono:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}
html[data-theme="dark"]{
  --bg:#1f1f1e; --bg-side:#1a1a19; --bg-hover:#262625; --bg-input:#282827;
  --panel:#1a1a19; --panel2:#242422;
  --border:#33332f; --border2:#44443f;
  --text:#f3f4f6; --text2:#a8a8a3; --text3:#747470;
  --accent:#22c55e; --accent2:#16a34a; --accent-bg:rgba(34,197,94,.14);
  --btn-bg:#f3f4f6; --btn-fg:#111;
  --green:#22c55e; --red:#ef4444; --amber:#eab308;
  --shadow:0 2px 20px rgba(0,0,0,.45);
  --code-bg:#161616; --code-head:#1f1f1e;
}
html[data-theme="light"]{
  --bg:#ffffff; --bg-side:#f6f6f5; --bg-hover:#ececea; --bg-input:#f3f3f2;
  --panel:#f6f6f5; --panel2:#ffffff;
  --border:#e3e3e0; --border2:#d0d0cc;
  --text:#1a1a19; --text2:#565653; --text3:#90908c;
  --accent:#16a34a; --accent2:#15803d; --accent-bg:rgba(22,163,74,.1);
  --btn-bg:#1a1a19; --btn-fg:#ffffff;
  --shadow:0 2px 14px rgba(0,0,0,.09);
  --code-bg:#f5f5f4; --code:#262626;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit}
input,select,textarea{font-family:inherit;color:inherit;outline:none}
a{color:var(--accent)}
*{scrollbar-width:thin;scrollbar-color:var(--border) transparent}
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
::focus-visible{outline:2px solid var(--text3);outline-offset:1px}
svg{width:1em;height:1em;vertical-align:-0.125em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
svg.filled{fill:currentColor;stroke:none}

/* ============ LAYOUT ============ */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:272px;min-width:272px;background:var(--bg-side);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:transform .2s ease;z-index:50}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}

/* ============ SIDEBAR ============ */
.sb-head{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 6px}
.sb-close{color:var(--text3);padding:6px;border-radius:7px;line-height:0;display:inline-flex;align-items:center;justify-content:center}
.sb-close svg{width:17px;height:17px}
.sb-close:hover{background:var(--bg-hover);color:var(--text)}
body.sb-collapsed .sidebar{display:none}
.sb-brand{display:flex;align-items:center;gap:7px;font-family:var(--serif);font-weight:600;font-size:21px;letter-spacing:.2px;padding:12px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-brand .brand-logo{width:24px;height:24px;object-fit:contain;flex-shrink:0;border-radius:6px}
.sb-brand .logo{width:26px;height:26px;border-radius:7px;background:var(--accent);color:#111;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.new-btn{display:flex;align-items:center;gap:8px;width:calc(100% - 20px);margin:12px 10px 8px;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:13px;font-weight:500;transition:background .12s}
.new-btn:hover{background:var(--bg-hover)}
.new-btn svg{width:15px;height:15px}
.ws-btn{font-size:13px}
.ws-chip{display:flex;align-items:center;gap:7px;width:calc(100% - 20px);margin:2px 10px 6px;padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text2);font-size:12px;font-weight:500;cursor:pointer;transition:background .12s,border-color .12s}
.ws-chip:hover{background:var(--bg-hover);color:var(--text);border-color:var(--text3)}
.ws-chip-icon{width:15px;height:15px;color:var(--accent);display:flex;align-items:center;flex-shrink:0}
.ws-chip-icon svg{width:15px;height:15px}
.ws-chip-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:left}
.ws-list{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto}
.ws-row{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:var(--bg-input)}
.ws-row.active{border-color:var(--accent);background:var(--accent-bg)}
.ws-row-main{display:flex;align-items:center;gap:9px;flex:1;min-width:0;cursor:pointer}
.ws-row-icon{width:16px;height:16px;color:var(--accent);flex-shrink:0}
.ws-row-icon svg{width:16px;height:16px}
.ws-row-name{font-weight:600;font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-row-count{font-size:11px;color:var(--text3);white-space:nowrap}
.ws-row-actions{display:flex;gap:4px;flex-shrink:0}
.start-title-row{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:820px;margin:6px 0 12px}
.start-title-row .start-title{margin:0}
.start-hide{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border:1px solid var(--border);border-radius:6px;background:var(--bg-input);color:var(--text3);cursor:pointer;transition:color .12s,border-color .12s}
.start-hide:hover{color:var(--text);border-color:var(--text3)}
.start-hide svg{width:15px;height:15px}
.start-hidden{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--text3);font-size:13px}
.start-hide-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--bg-input);color:var(--text2);font-size:13px;font-weight:500;padding:9px 14px;border-radius:8px;cursor:pointer;transition:border-color .12s,color .12s,background .12s}
.start-hide-btn:hover{border-color:var(--text3);color:var(--text);background:var(--bg-hover)}
.start-hide-btn svg{width:15px;height:15px;color:var(--accent)}
.sb-search{position:relative;padding:4px 10px 6px}
.sb-search .icon{position:absolute;left:20px;top:13px;color:var(--text3);width:15px;height:15px}
.sb-search input{width:100%;padding:9px 12px 9px 30px;border-radius:8px;border:1px solid var(--border);background:var(--bg-input);font-size:13px;transition:border-color .12s}
.sb-search input:focus{border-color:var(--text3)}
.sb-list{flex:1;overflow-y:auto;padding:0 6px 12px}
.sb-group{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);padding:14px 10px 4px;font-weight:600}
.sb-item{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--text2);border:1px solid transparent;margin-bottom:1px;font-size:13px;position:relative;transition:background .1s}
.sb-item:hover{background:var(--bg-hover);color:var(--text)}
.sb-item.active{background:var(--bg-hover);color:var(--text);border-color:var(--border)}
.sb-item .title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-item .menu-btn{opacity:0;color:var(--text3);padding:3px;border-radius:5px;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.sb-item:hover .menu-btn{opacity:1}
.sb-item .menu-btn:hover{background:var(--border);color:var(--text)}
.sb-item-actions{position:absolute;right:6px;top:calc(100% + 2px);background:var(--panel2);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);z-index:60;padding:4px;min-width:150px}
.sb-item-actions button{display:flex;width:100%;align-items:center;gap:8px;color:var(--text);padding:7px 10px;border-radius:6px;font-size:13px;text-align:left}
.sb-item-actions button:hover{background:var(--bg-hover)}
.sb-item-actions button.danger{color:var(--red)}
.sb-item-actions button.danger:hover{background:rgba(240,107,114,.1)}
.sb-foot{padding:10px 14px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sb-links{display:flex;gap:2px;flex-wrap:wrap;align-items:center;padding:9px 12px;border-top:1px solid var(--border);font-size:11px;color:var(--text3)}
.sb-links button{background:none;border:none;color:var(--text3);font-size:11px;cursor:pointer;padding:2px 4px;transition:color .12s}
.sb-links button:hover{color:var(--text)}
.sb-links .sep{opacity:.5}
.readonly{display:block;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--text3);font-family:monospace;letter-spacing:1px}
.offline-dot{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text3)}
.offline-dot .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.offline-dot.offline .dot{background:var(--amber)}
.offline-dot.offline{color:var(--amber)}
.icon-btn{color:var(--text2);padding:6px;border-radius:7px;line-height:0;display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover{background:var(--bg-hover);color:var(--text)}
.icon-btn svg{width:17px;height:17px}

/* ============ TOPBAR ============ */
.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--bg)}
.hamburger{display:flex;color:var(--text);padding:6px;border-radius:7px;line-height:0}
.hamburger svg{width:20px;height:20px}
.hamburger:hover{background:var(--bg-hover)}
.model-picker{display:flex;gap:8px;flex-wrap:wrap}
.picker{position:relative}
.picker-btn{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:12px;max-width:230px;text-align:left}
.picker-btn:hover{border-color:var(--text3)}
.picker-btn .caret{color:var(--text3);font-size:10px;line-height:1}
.picker-btn .pk-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;display:block}
.picker-btn .pk-val{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px;font-size:13px}
.picker-dropdown{position:absolute;top:calc(100% + 6px);left:0;background:var(--panel2);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);z-index:100;min-width:320px;max-width:420px;overflow:hidden}
.picker-search{padding:10px;border-bottom:1px solid var(--border)}
.picker-search input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg-input);font-size:13px}
.picker-search input:focus{border-color:var(--text3)}
.picker-list{max-height:380px;overflow-y:auto;padding:4px}
.picker-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px}
.picker-item:hover{background:var(--bg-hover)}
.picker-item.selected{background:var(--accent-bg)}
.picker-item .star{color:var(--text3);padding:0 2px;line-height:1;display:inline-flex}
.picker-item .star.on{color:var(--amber)}
.picker-item .star svg{width:15px;height:15px}
.picker-item .mname{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picker-item .mctx{font-size:11px;color:var(--text3);white-space:nowrap}
.picker-empty{padding:20px;text-align:center;color:var(--text3);font-size:13px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:4px}
.provider-status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);margin-right:6px}
.provider-status .pdot{width:8px;height:8px;border-radius:50%;background:var(--text3)}
.provider-status.ok .pdot{background:var(--green)}
.provider-status.err .pdot{background:var(--red)}
.provider-status.unconf .pdot{background:var(--amber)}

/* ============ DEMO BANNER ============ */
.demo-banner{display:none;align-items:center;gap:8px;background:var(--accent-bg);border:1px solid var(--border);color:var(--text2);padding:8px 14px;font-size:12px;border-radius:8px;margin:10px 16px 0}
.demo-banner.show{display:flex}
.demo-banner svg{width:16px;height:16px;color:var(--amber)}

/* ============ CHAT ============ */
.chat-wrap{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.chat-inner{max-width:760px;width:100%;margin:0 auto;padding:28px 24px 16px;flex:1}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;text-align:center;padding:36px 20px}
.hero{padding-bottom:12px}
.hero .hero-logo{display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--serif);font-size:54px;font-weight:700;letter-spacing:-1px;color:var(--text);margin-bottom:6px}
.hero .hero-logo img.hero-brand{width:44px;height:44px;object-fit:contain}
.hero .hero-tag{font-family:var(--serif);font-size:30px;color:var(--text);line-height:1.3}
.hero .hero-hl{font-style:italic;background:var(--accent);color:#0a0f0a;padding:1px 10px;border-radius:6px;font-weight:700}
.hero .hero-sub{color:var(--text2);margin-top:16px;font-size:14px}
.start-title{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);margin:6px 0 12px;text-align:left;width:100%;max-width:820px}
.start-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:820px;padding-bottom:4px}
.start-card{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;background:var(--bg-input);border:1px solid var(--border);border-radius:10px;padding:16px;transition:border-color .12s,background .12s;cursor:pointer}
.start-card:hover{border-color:var(--text3);background:var(--bg-hover)}
.start-card .sc-icon{width:34px;height:34px;border-radius:8px;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.start-card .sc-icon svg{width:19px;height:19px}
.start-card .sc-title{font-weight:600;font-size:14px;color:var(--text)}
.start-card .sc-desc{font-size:12px;color:var(--text2)}
@media (max-width:760px){.start-grid{grid-template-columns:repeat(2,1fr)}.hero .hero-logo{font-size:40px;gap:8px}.hero .hero-logo img.hero-brand{width:32px;height:32px}.hero .hero-tag{font-size:24px}}
.msg{display:flex;gap:12px;padding:16px 0}
.msg-body{flex:1;min-width:0}
.msg-meta{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.msg-role{font-weight:600;font-size:13px}
.msg-time{font-size:11px;color:var(--text3)}
.msg-model{font-size:11px;color:var(--text3)}
.msg-content{color:var(--text);overflow-wrap:break-word}
.msg-avatar{width:28px;height:28px;min-width:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--text3);flex-shrink:0}
.msg-avatar svg{width:16px;height:16px;stroke:#fff}
.msg.user .msg-avatar{background:#d0d0d0;color:#555}
.msg.user .msg-avatar svg{stroke:#555}
.msg.assistant .msg-avatar{background:var(--btn-bg);color:var(--btn-fg)}
.msg.assistant .msg-avatar svg{stroke:var(--btn-fg)}
.msg.system .msg-avatar{background:var(--text3)}
.msg-actions{display:flex;gap:4px;margin-top:8px;opacity:0;transition:opacity .12s}
.msg:hover .msg-actions{opacity:1}
.msg-actions button{display:inline-flex;align-items:center;gap:5px;color:var(--text2);padding:4px 9px;border-radius:6px;font-size:12px}
.msg-actions button:hover{background:var(--bg-hover);color:var(--text)}
.msg-actions button svg{width:14px;height:14px}
.error-box{background:rgba(224,107,93,.06);border:1px solid rgba(224,107,93,.3);border-radius:8px;padding:12px;font-size:13px;color:var(--red)}
.error-box .eb-title{font-weight:600;margin-bottom:6px}
.error-box .eb-detail{display:none;margin-top:8px}
.error-box .eb-detail.show{display:block}
.error-box pre{background:var(--code-bg);padding:10px;border-radius:8px;font-family:var(--mono);font-size:12px;white-space:pre-wrap;color:var(--text2);margin:0}
.error-actions{display:flex;gap:8px;margin-top:10px}
.error-actions button{padding:6px 12px;border-radius:7px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:12px}
.error-actions button:hover{background:var(--bg-hover)}
.thinking{display:inline-flex;align-items:center;gap:8px;color:var(--text2)}
.thinking .spinner{width:13px;height:13px;border:2px solid var(--border2);border-top-color:var(--text);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cursor-blink::after{content:"▋";color:var(--text);animation:blink 1s step-end infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}

/* ============ MARKDOWN ============ */
.md h1,.md h2,.md h3,.md h4{margin:16px 0 8px;line-height:1.35;font-weight:600}
.md h1{font-size:1.4em}.md h2{font-size:1.25em}.md h3{font-size:1.12em}.md h4{font-size:1.05em}
.md p{margin:8px 0}
.md ul,.md ol{margin:8px 0;padding-left:22px}
.md li{margin:2px 0}
.md blockquote{border-left:3px solid var(--border2);padding:4px 12px;color:var(--text2);margin:10px 0}
.md blockquote p{margin:0}
.md a{text-decoration:underline;text-underline-offset:2px}
.md code.inline{background:var(--code-bg);padding:2px 6px;border-radius:5px;font-family:var(--mono);font-size:.9em;color:var(--code)}
.md table{border-collapse:collapse;margin:12px 0;width:100%;font-size:13px}
.md th,.md td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.md th{background:var(--bg-hover);font-weight:600}
.md hr{border:none;border-top:1px solid var(--border);margin:16px 0}
.md img{max-width:100%;border-radius:8px}
.codeblock{margin:12px 0;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--code-bg)}
.codeblock-head{display:flex;align-items:center;justify-content:space-between;padding:5px 10px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text3)}
.codeblock-head .lang{font-family:var(--mono);text-transform:lowercase}
.codeblock-head button{display:inline-flex;align-items:center;gap:5px;color:var(--text2);padding:3px 8px;border-radius:5px;font-size:12px}
.codeblock-head button:hover{background:var(--bg-hover);color:var(--text)}
.codeblock pre{padding:12px;overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.55;margin:0;color:var(--text)}
.codeblock code{font-family:var(--mono)}

/* ============ COMPOSER ============ */
.composer{padding:10px 16px 18px;background:var(--bg)}
.composer-inner{max-width:760px;margin:0 auto}
.attach-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.attach-chip{display:flex;align-items:center;gap:6px;background:var(--bg-hover);border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:12px;color:var(--text2)}
.attach-chip .x{color:var(--text3);font-size:14px;line-height:1;padding:0 2px}
.attach-chip .x:hover{color:var(--red)}
.attach-chip svg{width:14px;height:14px}
.input-row{display:flex;align-items:flex-end;gap:6px;background:var(--panel2);border:1px solid var(--border);border-radius:18px;padding:8px 10px;transition:border-color .12s}
.input-row:focus-within{border-color:var(--text3)}
textarea{flex:1;border:none;background:none;resize:none;outline:none;font-size:14px;max-height:180px;min-height:26px;padding:2px 4px}
.attach-btn,.send-btn{color:var(--text2);padding:6px;border-radius:8px;line-height:0;display:inline-flex;align-items:center;justify-content:center}
.attach-btn{display:inline-flex;align-items:center;gap:6px;color:var(--text2);padding:7px 12px;border-radius:999px;border:1px solid var(--border);background:var(--bg);line-height:1;font-size:13px}
.attach-btn svg{width:15px;height:15px}
.attach-btn:hover{color:var(--text);border-color:var(--text3);background:var(--bg-hover)}
.send-btn{width:34px;height:34px;border-radius:50%;background:var(--btn-bg);color:var(--btn-fg);flex-shrink:0;transition:opacity .12s}
.send-btn svg{width:16px;height:16px;stroke:var(--btn-fg)}
.send-btn:hover{opacity:.85}
.send-btn.stop{background:var(--red);color:#fff}
.send-btn.stop svg{stroke:#fff}
.send-btn:disabled{opacity:.4;cursor:not-allowed}
.composer-hint{font-size:11px;color:var(--text3);margin-top:8px;text-align:center;display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap}
.composer-hint .flag{width:18px;height:11px;border-radius:2px;flex-shrink:0}
.composer-hint .flag *{stroke:none}

/* ============ MODAL / SETTINGS ============ */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal{background:var(--bg);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:560px;max-height:90vh;display:flex;flex-direction:column}
.modal.lg{max-width:720px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-head h2{font-size:16px;font-weight:600}
.modal-close{color:var(--text3);font-size:20px;line-height:1;padding:2px 6px;border-radius:6px}
.modal-close:hover{background:var(--bg-hover);color:var(--text)}
.modal-body{padding:20px;overflow-y:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.settings-nav{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:18px;flex-wrap:wrap}
.settings-nav button{color:var(--text2);padding:8px 14px;border-radius:6px 6px 0 0;font-size:13px;font-weight:500}
.settings-nav button:hover{color:var(--text)}
.settings-nav button.active{color:var(--text);border-bottom:2px solid var(--accent)}
.limit-modal{max-width:380px;text-align:center;padding:28px 24px}
.limit-modal .limit-icon{width:48px;height:48px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;border-radius:13px;background:rgba(239,68,68,.13);color:#ef4444}
.limit-modal .limit-icon svg{width:24px;height:24px}
.limit-modal h2{margin:0 0 10px;font-size:20px}
.limit-msg{font-size:13px;color:var(--text2);line-height:1.55}
.limit-countdown{font-size:34px;font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums;margin:14px 0 6px;color:var(--accent)}
.limit-sub{font-size:12px;color:var(--text3);margin-bottom:18px}
.limit-modal .btn.primary{margin-top:2px}
.usage-badge{display:inline-flex;align-items:center;gap:6px;color:var(--text3);font-size:11px;font-weight:500}
.usage-badge.warn{color:#f59e0b}
.usage-badge.ok{color:var(--accent)}
.setting-group{margin-bottom:22px}
.setting-group h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px;font-weight:500}
.field input[type=text],.field input[type=password],.field input[type=number],.field select,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:9px;background:var(--bg-input);font-size:13px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--text3)}
.field textarea{resize:vertical;min-height:70px}
.field-row{display:flex;gap:8px;align-items:center}
.field-row input{flex:1}
.field .hint{font-size:11px;color:var(--text3);margin-top:5px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;border:1px solid var(--border);background:var(--bg-hover);color:var(--text);font-size:13px;font-weight:500;transition:background .12s}
.btn:hover{background:var(--border)}
.btn.primary{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-fg)}
.btn.primary:hover{opacity:.85}
.btn.danger{background:transparent;border-color:rgba(224,107,93,.5);color:var(--red)}
.btn.danger:hover{background:rgba(224,107,93,.1)}
.btn.small{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.switch{position:relative;display:inline-block;width:40px;height:22px}
.switch input{opacity:0;width:0;height:0}
.switch .slider{position:absolute;cursor:pointer;inset:0;background:var(--border2);border-radius:22px;transition:.15s}
.switch .slider:before{content:"";position:absolute;height:16px;width:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+.slider{background:var(--accent)}
.switch input:checked+.slider:before{transform:translateX(18px)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0}
.toggle-row .lbl{font-size:13px}
.toggle-row .sub{font-size:11px;color:var(--text3);margin-top:2px}
.setting-stat{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.stat-card{flex:1;min-width:120px;background:var(--bg-hover);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center}
.stat-card .num{font-size:22px;font-weight:600;color:var(--text)}
.stat-card .lbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;margin-top:4px}
.log-table{width:100%;border-collapse:collapse;font-size:12px}
.log-table th,.log-table td{padding:7px 9px;border-bottom:1px solid var(--border);text-align:left;color:var(--text2)}
.log-table th{color:var(--text3);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.3px}
.status-badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:500}
.status-badge .sd{width:7px;height:7px;border-radius:50%;background:currentColor}
.status-badge.ok{background:rgba(78,201,106,.14);color:var(--green)}
.status-badge.err{background:rgba(240,107,114,.14);color:var(--red)}
.status-badge.warn{background:rgba(240,201,116,.16);color:var(--amber)}
.secret-note{font-size:12px;color:var(--text2);background:var(--accent-bg);border:1px solid rgba(13,91,215,.2);padding:10px 12px;border-radius:9px;margin-bottom:16px;line-height:1.5}
.provider-card{border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;background:var(--panel2)}
.provider-card .pc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.provider-card .pc-title{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.provider-card .pc-status{font-size:12px}
.usage-list{font-size:13px}
.usage-list .urow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border)}
.usage-list .urow:last-child{border-bottom:none}
.usage-list .urow .key{color:var(--text2)}
.usage-list .urow .val{font-weight:500}
.info-box{font-size:13px;color:var(--text2);background:var(--bg-hover);border:1px solid var(--border);padding:12px;border-radius:9px;line-height:1.6}
.model-mgr-group{margin-bottom:16px}
.model-mgr-group h4{margin-bottom:8px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.model-mgr-row{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;background:var(--bg-input);gap:8px}
.model-mgr-row .mm-info{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.model-mgr-row .star{color:var(--text3);padding:0 2px;line-height:1;display:inline-flex}
.model-mgr-row .star.on{color:var(--amber)}
.model-mgr-row .star svg{width:15px;height:15px}
.model-mgr-row .mname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.model-mgr-row .mid{font-size:11px;color:var(--text3);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.model-mgr-row .info-btn{color:var(--text3);padding:2px 4px;line-height:0;display:inline-flex}
.model-mgr-row .info-btn:hover{color:var(--text)}
.model-mgr-row .info-btn svg{width:15px;height:15px}
.model-mgr-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}

/* ============ TOAST ============ */
.toast-container{position:fixed;bottom:20px;right:20px;z-index:400;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow);font-size:13px;display:flex;align-items:center;gap:9px;animation:slideIn .18s ease;max-width:340px}
.toast .ticon{display:inline-flex}
.toast .ticon svg{width:16px;height:16px}
.toast.success .ticon{color:var(--green)}
.toast.error .ticon{color:var(--red)}
.toast.info .ticon{color:var(--accent)}
@keyframes slideIn{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ============ LEGAL ============ */
.legal-body{padding:24px;color:var(--text2);font-size:14px;line-height:1.65}
.legal-body h1{font-size:22px;color:var(--text);margin:0 0 12px;font-family:var(--serif)}
.legal-body h2{font-size:16px;color:var(--text);margin:24px 0 8px;font-family:var(--serif)}
.legal-body h3{font-size:14px;color:var(--text);margin:18px 0 6px}
.legal-body p{margin:8px 0}
.legal-body ul,.legal-body ol{margin:8px 0 10px 22px;padding:0}
.legal-body li{margin:3px 0}
.legal-body strong{color:var(--text)}

/* ============ CONFIRM ============ */
.confirm-modal{max-width:420px}
.confirm-body{padding:20px;font-size:14px}
.confirm-body .warn-icon{font-size:20px;margin-bottom:10px;color:var(--amber)}
.confirm-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--border)}

/* ============ RESPONSIVE ============ */
@media (max-width:820px){
  .sidebar{position:fixed;top:0;left:0;bottom:0;transform:translateX(-100%);box-shadow:var(--shadow);width:280px}
  .sidebar.open{transform:translateX(0)}
  .hamburger{display:block}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}
  .overlay.show{display:block}
  .picker-btn{max-width:120px}
  .topbar{gap:6px;padding:10px}
  .model-picker{gap:6px}
  .picker-dropdown{position:fixed;left:12px;right:12px;top:64px}
  .provider-status{display:none}
}

/* ============ AUTH SCREEN ============ */
.authScreen{position:fixed;inset:0;z-index:1000;display:flex;align-items:stretch;font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.authScreen.hidden{display:none}
.auth-wrap{display:flex;width:100%;min-height:100vh;background:#fff}
.auth-left{flex:1;background:#fff;display:flex;align-items:center;justify-content:center;padding:40px 24px}
.auth-form{width:100%;max-width:400px;display:flex;flex-direction:column}
.auth-title{font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:28px;font-weight:700;color:#0c0d0e;margin:0 0 24px;text-align:center;white-space:nowrap}
.auth-title .ac{font-family:Georgia,'Times New Roman',serif;font-weight:700;color:#16a34a}
.auth-google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px 14px;border:1px solid #d9d9d9;border-radius:8px;background:#fff;color:#0c0d0e;font-size:14px;font-weight:500;cursor:pointer;transition:background .12s,border-color .12s}
.auth-google:hover{background:#f7f7f7}
.auth-or{display:flex;align-items:center;gap:12px;margin:20px 0;color:#8a8a8a;font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.auth-or::before,.auth-or::after{content:"";flex:1;height:1px;background:#e5e5e5}
.auth-form .field{margin-bottom:14px}
.auth-form .field label{display:block;font-size:13px;font-weight:600;color:#0c0d0e;margin-bottom:6px}
.auth-form .field input{width:100%;padding:11px 13px;border:1px solid #d9d9d9;border-radius:8px;font-size:14px;color:#0c0d0e;background:#fff;box-sizing:border-box}
.auth-form .field input:focus{outline:none;border-color:#16a34a}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:46px}
.pw-eye{position:absolute;right:5px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#6b6b6b;padding:6px;display:flex;align-items:center}
.pw-eye svg{width:18px;height:18px}
.remember{display:flex;align-items:center;gap:8px;font-size:13px;color:#3c3c3c;margin:2px 0 16px;cursor:pointer}
.remember input{width:15px;height:15px;accent-color:#16a34a;margin:0}
.auth-btn{width:100%;padding:12px;border:none;border-radius:8px;background:#16a34a;color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:background .12s}
.auth-btn:hover{background:#15803d}
.auth-btn:disabled{opacity:.6;cursor:default}
.auth-links{margin-top:16px;text-align:center;font-size:13px;color:#3c3c3c}
.auth-links p{margin:4px 0}
.link{background:none;border:none;color:#16a34a;cursor:pointer;font-size:13px;padding:0}
.link:hover{text-decoration:underline}
.auth-err{display:none;background:#fdecec;color:#b3261e;border:1px solid #f5c6c0;border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:14px}
.auth-ok{background:#e7f6ec;color:#166534;border:1px solid #bbe8c8;border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:14px}
.auth-legal{text-align:center;font-size:11px;color:#6b6b6b;margin-top:20px;white-space:nowrap}
.auth-legal a{color:#6b6b6b;text-decoration:underline;cursor:pointer;background:none;border:none;font-size:12px;padding:0}
.auth-cookie{margin-top:20px;display:flex;justify-content:center}
.auth-cookie button{background:none;border:none;cursor:pointer;font-size:12px;color:#6b6b6b;text-decoration:underline}
.auth-copyright{margin-top:auto;text-align:center;font-size:11px;color:#9a9a9a}
.auth-right{flex:1;background:#0c0d0e;color:#fff;display:flex;flex-direction:column;padding:34px 40px;position:relative;overflow:hidden}
.auth-right-top{display:flex;align-items:center;justify-content:flex-end;gap:16px;position:relative;z-index:2}
.lang-wrap{position:relative}
.lang-menu{position:absolute;top:calc(100% + 8px);right:0;background:#fff;border:1px solid #e5e5e5;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:4px;min-width:150px;display:none;z-index:60}
.lang-menu.open{display:block}
.lang-menu button{display:block;width:100%;text-align:left;background:none;border:none;padding:8px 12px;font-size:13px;color:#0c0d0e;border-radius:6px;cursor:pointer}
.lang-menu button:hover{background:#f2f2f2}
.lang-menu button.on{color:#16a34a;font-weight:600}
.auth-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none}
.lang{display:flex;align-items:center;gap:6px;font-size:13px;color:#e6e6e6;cursor:pointer}
.lang svg{width:15px;height:15px;flex-shrink:0}
.auth-signup-btn{background:#fff;color:#0c0d0e;border:none;border-radius:8px;padding:9px 18px;font-size:14px;font-weight:600;cursor:pointer}
.auth-right-body{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;position:relative;z-index:2}
.globe{position:absolute;right:-70px;bottom:-70px;opacity:.55;pointer-events:none;z-index:0}
.globe svg{width:440px;height:440px;display:block}
.auth-headline{font-family:Georgia,'Times New Roman',serif;font-size:35px;font-weight:700;color:#fff;line-height:1.12;max-width:420px;position:relative;z-index:2}
.auth-headline .hl{color:#fff}
.register-btn{margin-top:24px;display:flex;align-items:center;gap:9px;background:#fff;color:#0c0d0e;border:none;border-radius:8px;padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer}
.register-btn svg{width:16px;height:16px}
@media (max-width:860px){.auth-right{display:none}.auth-left{min-height:100vh}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Conversations">
    <div class="sb-head">
      <div class="sb-brand"><img class="brand-logo" src="logo.png?v=3" alt="dotcomAI"> dotcomAI</div>
      <button class="sb-close" id="btnSidebarClose" aria-label="Close sidebar" title="Close sidebar">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <button class="new-btn" id="btnNewChat" aria-label="New chat">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New chat
    </button>
    <button class="new-btn ws-btn" id="btnWorkspaces" aria-label="Workspaces">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      <span>Workspaces</span>
    </button>
    <button class="ws-chip" id="wsChip" onclick="openWorkspacesPanel()" title="Switch workspace">
      <span class="ws-chip-icon"><svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></span>
      <span class="ws-chip-name" id="wsChipName">General</span>
    </button>
    <form class="sb-search" autocomplete="off" onsubmit="return false">
      <span class="icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg></span>
      <input type="text" id="sbSearch" name="search-conversations" placeholder="Search conversations..." aria-label="Search conversations" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </form>
    <div class="sb-list" id="convList"></div>
    <div class="sb-links">
      <button onclick="showLegal('terms')">Terms of Use</button><span class="sep">·</span>
      <button onclick="showLegal('privacy')">Privacy Policy</button><span class="sep">·</span>
      <button onclick="showLegal('about')">About Us</button>
    </div>
    <div class="sb-foot">
      <div class="offline-dot" id="offlineDot"><span class="dot"></span><span id="offlineLabel">Online</span></div>
      <button class="icon-btn" id="btnTheme" title="Toggle theme" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" class="filled"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </aside>
  <div class="overlay" id="sbOverlay"></div>

  <main class="main">
    <header class="topbar">
      <button class="hamburger" id="btnHamburger" aria-label="Open menu">
        <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="model-picker">
        <div class="picker" id="providerPicker">
          <button class="picker-btn" id="providerPickerBtn" aria-haspopup="listbox" aria-expanded="false">
            <span><span class="pk-label">Provider</span><span class="pk-val" id="providerBtnLabel">Select</span></span>
            <span class="caret">▾</span>
          </button>
          <div class="picker-dropdown" id="providerDropdown" style="display:none"></div>
        </div>
        <div class="picker" id="modelPicker">
          <button class="picker-btn" id="modelPickerBtn" aria-haspopup="listbox" aria-expanded="false">
            <span><span class="pk-label">Model</span><span class="pk-val" id="modelBtnLabel">Select</span></span>
            <span class="caret">▾</span>
          </button>
          <div class="picker-dropdown" id="modelDropdown" style="display:none">
            <div class="picker-search"><input type="text" id="modelSearch" placeholder="Search models..." aria-label="Search models"></div>
            <div class="picker-list" id="modelList"></div>
          </div>
        </div>
      </div>
      <div class="topbar-right">

function download(filename,content,type){const blob=new Blob([content],{type:type||"text/plain"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportConv(id){const c=getConv(id);if(!c){notify("No conversation to export.","error");return}const who=m=>m.role==="user"?"You":m.role==="assistant"?"dotcomAI":"System";const content=c.messages.filter(m=>m.role!=="error").map(m=>"## "+who(m)+"\n\n"+m.content).join("\n\n---\n\n");download(slug(c.title)+".md",content,"text/markdown");notify("Conversation exported.","success");}
function exportAs(format){
  const c=currentConv();if(!c){notify("No conversation to export.","error");return}
  const title=c.title;const lines=c.messages.filter(m=>m.role!=="error").map(m=>{
    const who=m.role==="user"?"You":m.role==="assistant"?"dotcomAI":"System";
    if(format==="json")return{m:who,t:m.timestamp,c:m.content};
    if(format==="md")return"## "+who+"\n\n"+m.content;
    return who+":\n"+m.content;
  });
  let content,name,type;
  if(format==="json"){name=slug(title)+".json";content=JSON.stringify({title,createdAt:c.createdAt,provider:c.provider,model:c.model,messages:c.messages},null,2);type="application/json"}
  else if(format==="md"){name=slug(title)+".md";content=lines.join("\n\n---\n\n");type="text/markdown"}
  else{name=slug(title)+".txt";content=lines.join("\n\n---\n\n");type="text/plain"}
  download(name,content,type);notify("Conversation exported as "+format.toUpperCase(),"success");}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40)||"conversation"}
function download(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}

function renderAttach(){const box=$("#attachList");box.innerHTML=state.attachments.map((a,i)=>'<span class="attach-chip">'+I.paperclip+' '+esc(a.name)+' ('+a.size+' KB)<button class="x" onclick="removeAttach('+i+')">×</button></span>').join("")}
function removeAttach(i){state.attachments.splice(i,1);renderAttach();}
function handleFiles(files){
  const maxMB=state.settings.maxFileSizeMB||5;
  for(const f of files){
    if(f.size>maxMB*1024*1024){notify(f.name+" is larger than "+maxMB+" MB and was rejected.","error");continue}
    const dot=f.name.lastIndexOf(".");const suffix=dot>=0?f.name.slice(dot+1).toLowerCase():"";
    if(!FILE_EXTENSIONS.includes(suffix)){notify("Unsupported file type: ."+(suffix||"?")+" Supported: "+FILE_EXTENSIONS.join(", "),"error");continue}
    const reader=new FileReader();
    reader.onload=()=>{state.attachments.push({name:f.name,suffix:suffix||"txt",size:Math.round(f.size/1024),content:String(reader.result)});renderAttach()};
    reader.onerror=()=>notify("Could not read "+f.name+".","error");
    reader.readAsText(f);
  }
}

function signinHTML(){return'<h1 class="auth-title">'+tr("signinTitle")+' <span class="ac">dotcomAI</span></h1><div class="auth-err" id="authErr"></div><button class="auth-google" onclick="goGoogle()">'+tr("google")+'</button><div class="auth-or"><span>'+tr("or")+'</span></div><div class="field"><label>'+tr("email")+'</label><input type="email" id="authEmail" autocomplete="off" placeholder="name@example.com"></div><div class="field"><label>' + tr("password") + '</label><div class="pw-wrap"><input type="password" id="authPass" autocomplete="current-password" placeholder="••••••••"><button type="button" class="pw-eye" onclick="togglePw()">'+I.eye+'</button></div></div><label class="remember"><input type="checkbox" id="authRemember"><span>'+tr("remember")+'</span></label><button class="auth-btn" id="btnSignin" onclick="authSignIn()">'+tr("signinBtn")+'</button><div class="auth-links"><p>'+tr("noAccount")+' <button class="link" onclick="renderAuthMode(\'signup\')">'+tr("signupLink")+'</button></p><p><button class="link" onclick="renderAuthMode(\'forgot\')">'+tr("forgot")+'</button></p></div>'+authFoot();}
function signupHTML(){return'<h1 class="auth-title">'+tr("signupTitle")+' <span class="ac">dotcomAI</span></h1><div class="auth-err" id="authErr"></div><button class="auth-google" onclick="goGoogle()">'+tr("google")+'</button><div class="auth-or"><span>'+tr("or")+'</span></div><div class="field"><label>'+tr("email")+'</label><input type="email" id="authEmail" autocomplete="off" placeholder="name@example.com"></div><div class="field"><label>'+tr("password")+'</label><div class="pw-wrap"><input type="password" id="authPass" autocomplete="new-password" placeholder="At least 6 characters"><button type="button" class="pw-eye" onclick="togglePw(\'authPass\')">'+I.eye+'</button></div></div><div class="field"><label>'+tr("confirm")+'</label><div class="pw-wrap"><input type="password" id="authConfirmPass" autocomplete="new-password" placeholder="Repeat password"><button type="button" class="pw-eye" onclick="togglePw(\'authConfirmPass\')">'+I.eye+'</button></div></div><button class="auth-btn" id="authBtn" onclick="authSignUp()">'+tr("signupBtn")+'</button><div class="auth-links"><p>'+tr("haveAccount")+' <button class="link" onclick="renderAuthMode(\'signin\')">'+tr("signinLink")+'</button></p></div>'+authFoot();}
function forgotHTML(){return'<h1 class="auth-title">'+tr("resetTitle")+'</h1><div class="auth-err" id="authErr"></div><p style="color:#3c3c3c;font-size:13px;margin:0 0 14px">'+tr("resetHint")+'</p><div class="field"><label>'+tr("email")+'</label><input type="email" id="authEmail" autocomplete="off" placeholder="name@example.com"></div><button class="auth-btn" id="authBtn" onclick="authForgot()">'+tr("resetBtn")+'</button><div class="auth-links"><p><button class="link" onclick="renderAuthMode(\'signin\')">'+tr("back")+'</button></p></div>';}
function togglePw(id){const el=$("#"+id);if(!el)return;const isPw=el.type==="password";el.type=isPw?"text":"password";const btn=el.parentElement.querySelector(".pw-eye");if(btn)btn.innerHTML=isPw?I.eyeOff:I.eye;}
function authError(m){const el=$("#authErr");if(el){el.textContent=m;el.style.display="block";}}
function authOk(m){const el=$("#authErr");if(el){el.textContent=m;el.style.display="block";el.className="auth-ok";}}
function authBtnLoading(on){const b=$("#authBtn");if(b){b.disabled=on;b.textContent=on?(b.textContent==="Sign in"?"Signing in…":"Please wait…"):(b.dataset.orig||b.textContent);}}
async function authSignIn(){const email=$("#authEmail").value.trim();const pass=$("#authPass").value;if(!email||!pass){authError("Enter your email and password.");return}authError("");authBtnLoading(true);const r=$("#authRemember");try{if(r&&r.checked)localStorage.setItem("dc_auth_email",email);else localStorage.removeItem("dc_auth_email");}catch(e){}const {error}=await supabaseClient.auth.signInWithPassword({email,password:pass});authBtnLoading(false);if(error){authError(error.message);return}authScreenHide();notify("Signed in.","success");}
async function authSignUp(){const email=$("#authEmail").value.trim();const pass=$("#authPass").value;const conf=$("#authConfirmPass").value;if(!email||!pass||!conf){authError("Please fill in all fields.");return}if(pass.length<6){authError("Password must be at least 6 characters.");return}if(pass!==conf){authError("Passwords do not match.");return}authError("");authBtnLoading(true);try{const {data,error}=await supabaseClient.auth.signUp({email,password:pass,options:{}});authBtnLoading(false);if(error){authError(error.message);return}if(data.session){authScreenHide();notify("Signed in.","success");}else{authOk("Account created. Check your email to confirm your sign-up.");renderAuthMode("signin");}}catch(e){authBtnLoading(false);authError("Sign-up failed: "+(e&&e.message?e.message:"unable to reach Supabase. Check your connection."));}}
async function authForgot(){const email=$("#authEmail").value.trim();if(!email){authError("Enter your email.");return}authError("");try{const {error}=await supabaseClient.auth.resetPasswordForEmail(email);if(error){authError(error.message);return}authOk("Reset link sent. Check your inbox.");}catch(e){authError("Failed to send reset link: "+(e&&e.message?e.message:"unreachable Supabase"));}}
async function goGoogle(){try{const {error}=await supabaseClient.auth.signInWithOAuth({provider:"google",options:{redirectTo:window.location.href}});if(error){authError("Google sign-in failed: "+error.message);return;}}catch(e){authError("Google sign-in failed. Ensure the site is served over HTTPS and Google is enabled in your Supabase project.");}}
function authScreenHide(){const sc=$("#authScreen");if(sc)sc.classList.add("hidden");}
function initAuth(){const sc=$("#authScreen");try{const saved=localStorage.getItem("dc_lang");if(saved&&LANGS[saved])LANG=saved;}catch(e){}if(document&&document.addEventListener)document.addEventListener("click",function(ev){const m=$("#langMenu");if(m&&m.classList.contains("open")&&(!ev.target||!ev.target.closest||!ev.target.closest(".lang-wrap")))m.classList.remove("open");});renderAuthMode("signin");if(!initSupabase()){if(sc)sc.classList.add("hidden");return;}supabaseClient.auth.getSession().then(({data})=>{if(data.session){if(sc)sc.classList.add("hidden");loadUsageRemote();}else{if(sc)sc.classList.remove("hidden");renderAuthMode("signin");}}).catch(()=>{if(sc)sc.classList.remove("hidden");renderAuthMode("signin");});supabaseClient.auth.onAuthStateChange((ev,session)=>{if(sc){if(session){sc.classList.add("hidden");loadUsageRemote();}else{sc.classList.remove("hidden");renderAuthMode(ev==="PASSWORD_RECOVERY"?"forgot":"signin");}}});}

/* ============ INITIALIZATION ============ */
function init(){
  initAuth();
  loadAll();ensureProviders();applyTheme();initWorkspaces();
  // validate selected provider/model still exist
  if(!getProvider(state.selectedProvider))state.selectedProvider=state.providers.find(p=>p.enabled&&p.apiKey)?.id||null;
  if(state.selectedProvider){const models=state.models[state.selectedProvider]||[];if(!models.some(m=>m.id===state.selectedModel))state.selectedModel=models.length?models[0].id:null}
  if(!state.conversations.length){state.currentConversationId=null}else if(!getConv(state.currentConversationId))state.currentConversationId=state.conversations[0]?.id||null;
  wireEvents();renderSidebar();renderProvider();renderModelList();renderChat();renderAttach();updateOffline();updateProviderStatus();$("#demoBanner").classList.toggle("show",state.settings.demoMode);
  updateUsageBadge();
  autoLoadModels();
  // keep the chat-search box empty on load (prevents browser autofill from injecting the saved email)
  const _clearSearch=()=>{const s=$("#sbSearch");if(s)s.value="";};
  _clearSearch();setTimeout(_clearSearch,250);setTimeout(_clearSearch,1200);
  // first-run screen
  const hasAnyKey=state.providers.some(p=>p.apiKey);
  if(!hasAnyKey)showWelcome();
}
async function autoLoadModels(){for(const p of enabledProviders()){if(!p.apiKey||(state.models[p.id]&&state.models[p.id].length))continue;try{state.models[p.id]=await getModels(p.id);state.lastRefresh[p.id]=new Date().toISOString();p.status="connected";}catch(e){p.status="error"}}saveAll();renderProvider();updateProviderStatus();}
function showWelcome(){
  const ov=document.createElement("div");ov.className="modal-overlay";ov.id="welcomeModal";
  ov.innerHTML='<div class="modal"><div class="modal-head"><h2>dotcomAI</h2><button class="modal-close" onclick="this.closest(\'.modal-overlay\').remove()">×</button></div><div class="modal-body"><div style="text-align:center;margin-bottom:16px"><div style="font-size:28px">'+I.ai+'</div><p style="margin:6px 0 2px;font-weight:600;font-size:16px">Your personal multi-provider AI workspace.</p><p style="color:var(--text2)">Connect a provider to begin. This app runs locally in your browser — keys are stored only on this device.</p></div>'+
  state.providers.map(p=>'<div class="provider-card"><div class="pc-head"><div class="pc-title">'+esc(p.name)+'</div></div><div class="field"><label>API Key</label><input type="password" id="welcomeKey-'+p.id+'" placeholder="Paste your '+esc(p.name)+' API key" style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:9px;background:var(--bg2);color:var(--text)"></div><button class="btn primary" style="width:100%" onclick="welcomeConnect(\''+p.id+'\')">Connect '+esc(p.name)+'</button></div>').join("")+
  '<div style="text-align:center;margin-top:12px"><button class="btn" style="width:100%" onclick="this.closest(\'.modal-overlay\').remove()">Skip for now</button></div></div></div>';
  document.body.appendChild(ov);
}
function welcomeConnect(id){const v=$("#welcomeKey-"+id).value.trim();if(!v){notify("Enter an API key first.","error");return}const p=getProvider(id);p.apiKey=v;p.status="notconf";saveAll();$("#welcomeModal").remove();notify(p.name+" key saved locally. Use Test Connection and Refresh Models in Settings.","info");renderProvider();updateProviderStatus();}
function focusInput(){const i=$("#composerInput");if(i)i.focus();}
init();
</script>
